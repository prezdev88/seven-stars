<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#120b2b">
        <title>Seven Stars</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="shell">
            <header>
                <div
                    class="brand">
<span class="brand-icon">✦</span><span>SEVEN STARS<small>UNA AVENTURA ENTRE ESTRELLAS</small></span>
        </div>
                <div class="best">★ RÉCORD <strong id="best">0</strong>
        </div>
            </header>
            <section class="game"
                aria-label="Juego Seven Stars">
                <canvas id="game" width="480" height="700"
                    aria-label="Personaje corre y salta entre plataformas"></canvas>
                <div class="hud" aria-label="Estado de la partida">
                    <section class="hud-panel hud-player">
<span id="hearts" class="hearts" role="status" aria-label="3 corazones">♥ ♥ ♥</span><span id="power" class="power" hidden aria-label="Invencibilidad restante"></span>
<div class="hud-score-row" aria-label="Estrellas recogidas">
<span class="hud-bomb" aria-hidden="true">✦</span><strong id="score">0</strong>
</div>
          </section>
                    <section class="hud-panel hud-stage">
                        <div class="hud-stage-heading"
                            aria-label="Etapa actual">
<span aria-hidden="true">⚑</span><strong id="stage">01</strong>
            </div>
                        <div class="stage-track" aria-hidden="true">
                            <div id="stage-fill" class="stage-fill"></div>
                        </div>
                        <small id="progress"
                            aria-label="Progreso a la siguiente etapa">0/5</small>
                        <div class="hud-meta">
<small id="speed" aria-label="Multiplicador de velocidad">1,0×</small><small id="lives" aria-label="Continuaciones restantes">↻ 3</small>
            </div>
                    </section>
                </div>
                <div class="welcome" id="welcome">
                    <div class="welcome-content">
<img class="welcome-logo" src="images/branding/seven-stars-logo.png" alt="Seven Stars"><img class="welcome-characters" src="images/branding/seven-stars-characters.png" alt="Los siete personajes de Seven Stars"><button id="welcome-play" type="button">¡JUGAR! <span aria-hidden="true">→</span></button>
          </div>
                </div>
                <div class="overlay" id="overlay" hidden>
                    <div class="card">
<div class="sparkles">✦　✧　✦</div>
<div class="eyebrow" id="eyebrow">ESCOGE TU PERSONAJE</div>
<h1 id="title">SEVEN STARS</h1><p id="description">Elige tu personaje y prepárate para correr.</p>
<div class="fighter-preview" id="fighter-preview">
<div class="preview-glow">
</div>
<canvas id="preview-canvas" width="220" height="140" aria-label="Animación del personaje seleccionado"></canvas><strong id="selected-name">JIMINIE</strong>
</div>
<div class="characters" id="characters">
<button class="character" id="rm-choice" type="button" aria-pressed="false" aria-label="Seleccionar Namu"><span class="portrait"><img src="images/portraits/namu-portrait.png" alt=""></span><strong>NAMU</strong><small>SELECCIONAR</small></button><button class="character" id="jin-choice" type="button" aria-pressed="false" aria-label="Seleccionar Jino"><span class="portrait"><img src="images/portraits/jino-portrait.png" alt=""></span><strong>JINO</strong><small>SELECCIONAR</small></button><button class="character" id="suga-choice" type="button" aria-pressed="false" aria-label="Seleccionar Yuno"><span class="portrait"><img src="images/portraits/yuno-portrait.png" alt=""></span><strong>YUNO</strong><small>SELECCIONAR</small></button><button class="character" id="jhope-choice" type="button" aria-pressed="false" aria-label="Seleccionar Hobi"><span class="portrait"><img src="images/portraits/hobi-portrait.png" alt=""></span><strong>HOBI</strong><small>SELECCIONAR</small></button><button class="character" id="jimin-choice" type="button" aria-pressed="true" aria-label="Jiminie seleccionado"><span class="portrait"><img src="images/portraits/jiminie-portrait.png" alt=""></span><strong>JIMINIE</strong><small>SELECCIONADO ✓</small></button><button class="character" id="tae-choice" type="button" aria-pressed="false" aria-label="Seleccionar Taeo"><span class="portrait"><img src="images/portraits/taeo-portrait.png" alt=""></span><strong>TAEO</strong><small>SELECCIONAR</small></button><button class="character" id="jungkook-choice" type="button" aria-pressed="false" aria-label="Seleccionar Kookie"><span class="portrait"><img src="images/portraits/kookie-portrait.png" alt=""></span><strong>KOOKIE</strong><small>SELECCIONAR</small></button>
</div>
<button id="continue" hidden>CONTINUAR <span>→</span></button><button id="start">¡JUGAR!</button>
<div class="hint">☝ TOCA DOS VECES PARA DOBLE SALTO</div>
          </div>
                </div>
                <div id="paused" class="paused"
                    hidden>PAUSA <small>TOCA PARA CONTINUAR</small>
        </div>
                <button id="pause" class="pause" aria-label="Pausar juego"
                    hidden>Ⅱ</button>
            </section>
            <footer>
<span>✦ UNA CARRERA ENTRE ESTRELLAS</span><span>ESPACIO: SALTAR · ESC: PAUSA <b>↗</b></span>
      </footer>
        </main>
        <script src="game.js"></script>
    </body>
</html>
